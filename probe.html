<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>通信診断 v3</title>
<style>
  body{font-family:monospace;font-size:13px;line-height:1.6;margin:16px;background:#111;color:#eee;}
  h1{font-size:15px;} h2{font-size:13px;color:#8ab4f8;margin:16px 0 4px;}
  .box{border:1px solid #444;border-radius:8px;padding:10px 12px;margin:6px 0;white-space:pre-wrap;word-break:break-all;}
  .ok{color:#7CFC00;} .ng{color:#ff6b6b;} .wait{color:#aaa;}
  input{width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;border-radius:6px;border:1px solid #555;background:#222;color:#eee;}
  button{margin-top:6px;padding:8px 14px;border-radius:6px;border:none;background:#8ab4f8;color:#111;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<h1>確認サイト 通信診断 v3</h1>
<div class="box">別のURLを試すとき：下に /exec のURLを貼って「このURLをテスト」<br>
<input id="u" placeholder="https://script.google.com/macros/s/....../exec">
<button onclick="runCustom()">このURLをテスト</button></div>
<div class="box" id="env"></div>
<div id="results"></div>
<h2>判定</h2>
<div class="box" id="verdict"><span class="wait">テスト実行中...</span></div>
<script>
var TARGETS=[
  {label:"現行デプロイ（新）", url:"https://script.google.com/macros/s/AKfycbyntksSOJEuFUaqj7CyYl-4Xf-lEZmvI45QsJaIl9ry0yz0qFqSqsnVzMmNKP-0Danq3Q/exec"},
  {label:"（参考）旧デプロイ", url:"https://script.google.com/macros/s/AKfycbzSTZfRGSBWXVTda79ZVmRJrchfw3MJQOcE75vG8CtjtALR1nBUqeBLASHn7cFRD3H-/exec"}
];
var Q="?action=status&c=2";
var R={}, seq=0;
document.getElementById("env").textContent="時刻: "+new Date().toLocaleString("ja-JP")+"\nこのページ: "+location.href;
function esc(t){return String(t).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];});}
function addBox(id,title){
  var d=document.createElement("div");
  d.innerHTML='<h2>'+esc(title)+'</h2><div class="box" id="'+id+'_f"><span class=wait>fetch 実行中...</span></div><div class="box" id="'+id+'_j"><span class=wait>JSONP 実行中...</span></div>';
  document.getElementById("results").appendChild(d);
}
function show(id,html){document.getElementById(id).innerHTML=html;}
function judge(){
  var lines=[], anyPending=false;
  for(var k in R){ if(!R[k].f||!R[k].j){anyPending=true;continue;}
    var reach=R[k].f.reach||R[k].j.reach, term=(R[k].f.term||R[k].j.term);
    lines.push(R[k].label+": "+(reach?("到達OK / 新コード:"+(term?'<span class=ok>乗っている◎</span>':'<span class=ng>乗っていない</span>')):'<span class=ng>到達NG</span>'));
  }
  if(!anyPending&&lines.length) show("verdict",lines.join("\n")+"\n\n「到達OK＋新コード乗っている◎」のURLをこの画面ごと報告 → index.htmlをそのURLに向ける");
}
function test(label,url){
  var id="t"+(seq++);
  R[id]={label:label,f:null,j:null};
  addBox(id,label+"  "+url.slice(-24));
  fetch(url+Q).then(function(r){var st=r.status;return r.text().then(function(b){
    var hasTerm=b.indexOf('"term"')>=0,isJson=false;try{JSON.parse(b);isJson=true;}catch(e){}
    R[id].f={reach:(st===200&&isJson),term:hasTerm};
    show(id+"_f","fetch: HTTP "+st+" / JSON:"+(isJson?'<span class=ok>可</span>':'<span class=ng>不可</span>')+' / term:'+(hasTerm?'<span class=ok>あり</span>':'なし')+"\n先頭150文字: "+esc(b.substring(0,150)));
    judge();
  });}).catch(function(e){
    R[id].f={reach:false,term:false};
    show(id+"_f",'fetch: <span class=ng>通信失敗（匿名で到達できない）</span>'); judge();
  });
  var done=false,cb="__cb"+id;
  window[cb]=function(res){if(done)return;done=true;
    R[id].j={reach:true,term:!!(res&&res.term)};
    show(id+"_j",'JSONP: <span class=ok>成功</span> / mode='+esc(res&&res.mode||"?")+' / term='+esc(JSON.stringify(res&&res.term))); judge();};
  var s=document.createElement("script");
  s.src=url+Q+"&callback="+cb;
  s.onerror=function(){if(done)return;done=true;R[id].j={reach:false,term:false};
    show(id+"_j",'JSONP: <span class=ng>失敗（エラーページ）</span>'); judge();};
  setTimeout(function(){if(done)return;done=true;R[id].j={reach:false,term:false};
    show(id+"_j",'JSONP: <span class=ng>失敗（20秒無応答）</span>'); judge();},20000);
  document.body.appendChild(s);
}
function runCustom(){
  var u=(document.getElementById("u").value||"").trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(u)){alert("URLの形式が違う（.../exec で終わる形で貼って）");return;}
  test("手入力URL",u);
}
TARGETS.forEach(function(t){test(t.label,t.url);});
</script>
</body>
</html>
